<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 45px ;

        .chessboard{
            height: 600px;
            width: 600px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);

        }

</html>
